<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="rgba(245,158,11,0.3)" stroke-width="8"/>
  
  <!-- Architectural Construction Hex & Structure -->
  <g transform="translate(106, 96)" filter="url(#glow)">
    <!-- Base Foundation Plinth -->
    <rect x="20" y="260" width="260" height="36" rx="8" fill="url(#accent)" />
    <!-- Pillars -->
    <rect x="40" y="120" width="24" height="140" rx="4" fill="url(#accent)" opacity="0.9" />
    <rect x="138" y="120" width="24" height="140" rx="4" fill="url(#accent)" opacity="0.9" />
    <rect x="236" y="120" width="24" height="140" rx="4" fill="url(#accent)" opacity="0.9" />
    <!-- Pediment Triangular Roof / Arch -->
    <polygon points="150,20 20,110 280,110" fill="url(#accent)" />
    <!-- Center AI Sparkle -->
    <circle cx="150" cy="70" r="14" fill="#0b0f19" />
    <path d="M150 58 L153 67 L162 70 L153 73 L150 82 L147 73 L138 70 L147 67 Z" fill="#fbbf24" />
  </g>
</svg>
